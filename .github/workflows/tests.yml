name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lock matches requirements.txt
        run: python tools/check_lock.py
      - name: Install (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r requirements.lock -r requirements-dev.lock
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: No private values in the code
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python tools/check_generic.py
      - name: Shell scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
