# /etc/systemd/system/wardogs-votebot.service.d/health.conf
# Optional drop-in: adds ONE writable path for the private health snapshot. Every other
# sandbox setting of wardogs-votebot.service is inherited unchanged.
# The leading "-" means the bot still starts normally if the directory is missing.
[Service]
ReadWritePaths=-/run/wardogs-health
Environment=HEALTH_FILE=/run/wardogs-health/health.json
Environment=HEALTH_INTERVAL_SECONDS=20
